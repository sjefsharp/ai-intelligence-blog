name: Super-Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ESLint 8 (Super-Linter's pinned version) cannot consume this repo's
          # ESLint 10 flat config. The CI "Lint & TypeCheck" job runs ESLint
          # authoritatively, so the redundant Super-Linter JS/TS linters are off.
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_HTML: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE: false
          VALIDATE_GITHUB_ACTIONS: true
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          YAML_CONFIG_FILE: .yamllint.yml
          FILTER_REGEX_EXCLUDE: .*dist/.*|.*\.astro/.*|.*node_modules/.*|.*coverage/.*|.*data/.*
