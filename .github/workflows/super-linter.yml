name: Super-Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Super-Linter pins ESLint 8, which cannot consume this repo's ESLint 10
          # flat config. The CI "Lint & TypeCheck" job runs ESLint authoritatively,
          # so the JS/TS linters are simply not enabled here. Super-Linter forbids
          # mixing VALIDATE=true and VALIDATE=false, so unset linters stay off.
          # MARKDOWN and JSON are also left unset: Super-Linter cannot resolve the
          # repo's dotfile markdown config, and its JSON linter (ESLint 8 ESM)
          # fails on its own default config. The CI markdownlint gate owns markdown.
          VALIDATE_YAML: true
          VALIDATE_HTML: true
          VALIDATE_BASH: true
          VALIDATE_GITHUB_ACTIONS: true
          # Super-Linter formats its step summary with the repo's Prettier config,
          # which needs prettier-plugin-astro (not installed in its container).
          # We do not use the step summary or PR comments, so keep both off.
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          FILTER_REGEX_EXCLUDE: .*dist/.*|.*\.astro/.*|.*node_modules/.*|.*coverage/.*|.*data/.*
