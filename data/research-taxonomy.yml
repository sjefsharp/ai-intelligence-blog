# =============================================================================
# CANONICAL TERMINOLOGY REGISTRY (Cross-domain deduplication)
# =============================================================================
canonical_terminology:
  # Terms that appear across multiple domains - single authoritative definition
  - term: "Agent"
    definition:
      en: "Autonomous software entity that plans and executes actions toward a goal using tools"
      nl: "Autonome software-entiteit die plant en acties uitvoert naar een doel met tools"
    domains: ["agentic-ai-software-engineering"]
    aliases:
      en: ["LLM Agent", "Autonomous Agent"]
      nl: ["LLM Agent", "Autonome Agent"]
    forbidden:
      en: ["Bot", "Chatbot"]
      nl: ["Bot", "Chatbot"]
    source: "contract-glossary"

  - term: "Capability Token"
    definition:
      en: "Unforgeable token granting specific permission (model call, API request, budget)"
      nl: "Onvervalschbare token die specifieke toestemming geeft (model call, API request, budget)"
    domains:
      ["agentic-ai-software-engineering", "architecture-security-governance"]
    aliases:
      en: ["Auth Token", "Permission Token"]
      nl: ["Auth Token", "Permissie Token"]
    source: "contract-glossary"

  - term: "Model Context Protocol (MCP)"
    definition:
      en: "Open standard for connecting AI models to external tools and data sources"
      nl: "Open standaard voor het verbinden van AI modellen met externe tools en databronnen"
    domains: ["agentic-ai-software-engineering"]
    aliases:
      en: ["MCP"]
      nl: ["MCP"]
    source: "mcp-spec"

  - term: "Foundation Model"
    definition:
      en: "Large-scale model trained on broad data, adaptable to wide range of downstream tasks"
      nl: "Grootschalig model getraind op brede data, aanpasbaar aan wijd scala downstream taken"
    domains: ["models-inference-scientific"]
    aliases:
      en: ["Base Model", "Pre-trained Model"]
      nl: ["Base Model", "Pre-trained Model"]
    source: "academic-consensus"

  - term: "Open-Weight Model"
