# Lefthook Configuration
# https://lefthook.dev/configuration/

# Run staged files through formatters and linters
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{astro,ts,tsx,js,jsx,json,jsonc,yaml,yml,md,mdx,css,html}"
      run: pnpm exec prettier --check {staged_files}
      stage_fixed: true

    - name: eslint
      glob: "*.{ts,tsx,js,jsx,astro}"
      run: pnpm exec eslint {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: pnpm exec markdownlint {staged_files}
      stage_fixed: true

    - name: json-lint
      glob: "*.{json,jsonc}"
      run: pnpm exec jsonlint {staged_files}
      stage_fixed: true

    - name: astro-check
      glob: "*.astro"
      run: pnpm astro check --types-only
      stage_fixed: false

    - name: conflict-markers
      run: |
        if git diff --cached --name-only | xargs grep -l "^<<<<<<< " 2>/dev/null; then
          echo "ERROR: Conflict markers found in staged files"
          exit 1
        fi
      stage_fixed: false

# Validate commit message format
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Pre-push validation
pre-push:
  jobs:
    - name: typecheck
      run: pnpm astro check
      stage_fixed: false

    - name: build
      run: pnpm run build
      stage_fixed: false

    - name: unit-tests
      run: pnpm test --run
      stage_fixed: false

    - name: branch-name
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        # Allow trunk branches (master, main, develop)
        if echo "$branch" | grep -qE '^(master|main|develop)$'; then
          exit 0
        fi
        # Feature branches must follow Conventional Branch format
        # Types: feature/feat, bugfix/fix, hotfix, release, chore, ai/claude/codex/copilot/cursor
        if ! echo "$branch" | grep -qE '^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|build|ci|a11y|security|ai|claude|codex|copilot|cursor)/[a-z0-9-]+$'; then
          echo "ERROR: Branch name '$branch' does not follow Conventional Branch format"
          echo "Expected: <type>/<short-description> (or master/main/develop for trunk)"
          echo "Types: feat, feature, fix, bugfix, hotfix, release, chore, docs, refactor, perf, test, build, ci, a11y, security, ai, claude, codex, copilot, cursor"
          exit 1
        fi
      stage_fixed: false
