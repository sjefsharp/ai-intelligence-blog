      nl: "Advies- en onderzoeksbronnen leveren bewijs over alle domeinen; methodologiebeoordeling geldt universeel"
    strength: "meta"

# =============================================================================
# RING-TO-DOMAIN MAPPING (Integration with Discovery Rings)
# =============================================================================
ring_domain_mapping:
  ring1:
    description: "Official & Authoritative Sources — Canonical, versioned, traceable disclosures"
    primary_domains:
      - "agentic-ai-software-engineering" # Vendor agent/IDE releases, MCP specs
      - "models-inference-scientific" # Model releases, benchmarks, hardware announcements
      - "architecture-security-governance" # Standards bodies, cloud API docs, deprecations, security advisories
    secondary_domains:
      - "enterprise-adoption-organizational" # Cloud provider adoption guides
      - "economics-business-impact" # Cloud pricing, vendor financials
      - "independent-research-advisory" # Advisory org press releases (public)
    notes:
      en: "Ring 1 captures originator disclosures. A single source (e.g., AWS blog) may span multiple domains. Classification by content, not source."
      nl: "Ring 1 vangt oorsprong-openbaringen. Een enkele bron (bijv. AWS blog) kan meerdere domeinen beslaan. Classificatie op inhoud, niet bron."
  ring2:
    description: "Scientific Research & Technical Scrutiny — Original research, independent experiments, authoritative advisory"
    primary_domains:
      - "models-inference-scientific" # arXiv, conferences, reproducibility
      - "architecture-security-governance" # Security research, formal methods, governance frameworks
      - "independent-research-advisory" # Academic institutions, independent labs, methodology assessment
      - "enterprise-adoption-organizational" # Empirical adoption studies, productivity research
      - "economics-business-impact" # Economic research, market analysis
    secondary_domains:
      - "agentic-ai-software-engineering" # Agent evaluation, benchmark papers
    notes:
      en: "Ring 2 is methodology-driven. Advisory content classified Tier 2 only when methodology disclosed; else Tier 3/L0."
      nl: "Ring 2 is methodologie-gedreven. Adviescontent Tier 2 alleen bij methodologie-openbaring; anders Tier 3/L0."
  ring3:
    description: "Practitioner & Community Signal — Operational experience, maintainer insights, community-validated patterns"
    primary_domains:
      - "agentic-ai-software-engineering" # Community agent frameworks, practitioner blogs
      - "enterprise-adoption-organizational" # Practitioner adoption experiences, DevEx posts
      - "architecture-security-governance" # Incident reports, postmortems, operational patterns
    secondary_domains:
      - "models-inference-scientific" # Local LLM runtime experiences, quantization tips
      - "economics-business-impact" # Practitioner cost optimization posts
      - "independent-research-advisory" # Credible independent analyst posts
    notes:
      en: "Ring 3 requires corroboration. Track record and reproducibility are key signals. No auto-promote."
      nl: "Ring 3 vereist corroboratie. Track record en reproduceerbaarheid zijn sleutelsignalen. Geen auto-promote."

