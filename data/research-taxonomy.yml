    relationship: "constraint"
    description:
      en: "Agent systems must operate within architectural, security and governance boundaries"
      nl: "Agent systemen moeten opereren binnen architecturale, beveiligings- en governance grenzen"
    strength: "strong"
  - domains: ["models-inference-scientific", "architecture-security-governance"]
    relationship: "constraint"
    description:
      en: "Model deployment and inference architectures subject to security, governance, reliability requirements"
      nl: "Model deployment en inferentie architecturen onderworpen aan beveiliging, governance, betrouwbaarheidseisen"
    strength: "strong"
  - domains: ["enterprise-adoption-organizational", "economics-business-impact"]
    relationship: "feedback"
    description:
      en: "Adoption decisions driven by economics; adoption outcomes feed economic measurement"
      nl: "Adoptiebeslissingen gedreven door economie; adoptie-uitkomsten voeden economische meting"
    strength: "strong"
  - domains: ["independent-research-advisory", "all"]
