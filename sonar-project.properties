# SonarCloud Project Configuration
# https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

# REQUIRED: Replace with your SonarCloud project key
sonar.projectKey=REPLACE_WITH_PROJECT_KEY

# REQUIRED: Replace with your SonarCloud organization
sonar.organization=REPLACE_WITH_ORGANIZATION

# Project metadata
sonar.projectName=AI Intelligence Blog
sonar.projectVersion=0.0.1

# Source and test directories
sonar.sources=src
sonar.tests=src

# File patterns
sonar.inclusions=**/*.ts,**/*.tsx
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Exclusions
sonar.exclusions=**/*.astro,dist/**,.astro/**,node_modules/**,data/**,*.config.*,lefthook.yml,*.md,*.json,*.yml,*.yaml,*.css

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true