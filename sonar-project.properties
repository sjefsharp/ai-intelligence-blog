# SonarCloud Project Configuration
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters

# REQUIRED: Replace with your SonarCloud project key
sonar.projectKey=REPLACE_WITH_PROJECT_KEY

# REQUIRED: Replace with your SonarCloud organization
sonar.organization=REPLACE_WITH_ORGANIZATION

# Project metadata
sonar.projectName=AI Intelligence Blog
sonar.projectVersion=0.0.1

# Exclude binary images, screenshots and fonts from text analysis without changing
# how Playwright and Astro use these assets.
sonar.exclusions=**/*.astro,dist/**,.astro/**,node_modules/**,data/**,*.config.*,lefthook.yml,*.md,*.json,*.yml,*.yaml,*.css,**/*.png,**/*.jpg,**/*.ico,**/*.ttf,**/*.woff

# TypeScript configuration
sonar.typescript.tsconfigPaths=tsconfig.json

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Test files remain in static analysis but are not production code to cover.
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts

# Quality gate
sonar.qualitygate.wait=true