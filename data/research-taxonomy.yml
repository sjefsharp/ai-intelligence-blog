# =============================================================================
# VALIDATION RULES
# =============================================================================
validation_rules:
  - id: "VR-001"
    name: "All domain IDs follow pattern DOM-NN"
    check: "domains[*].stable_id matches ^DOM-\\d{2}$"
    severity: "error"
  - id: "VR-002"
    name: "All subdomain IDs follow pattern DOM-NN-SDNN"
    check: "domains[*].subdomains[*].stable_id matches ^DOM-\\d{2}-SD\\d{2}$"
    severity: "error"
  - id: "VR-003"
    name: "No duplicate stable_ids across domains"
    check: "unique(domains[*].stable_id)"
    severity: "error"
  - id: "VR-004"
    name: "No duplicate subdomain stable_ids"
    check: "unique(domains[*].subdomains[*].stable_id)"
    severity: "error"
  - id: "VR-005"
    name: "Every subdomain has at least one source_family"
    check: "domains[*].subdomains[*].source_families length >= 1"
    severity: "error"
  - id: "VR-006"
    name: "Every subdomain has at least one discovery_method"
    check: "domains[*].subdomains[*].discovery_methods length >= 1"
    severity: "error"
  - id: "VR-007"
    name: "Every subdomain has ring_affinity specified"
    check: "domains[*].subdomains[*].ring_affinity exists"
    severity: "error"
  - id: "VR-008"
    name: "Ring affinity values are subset of [1,2,3]"
    check: "domains[*].subdomains[*].ring_affinity subset of [1,2,3]"
    severity: "error"
  - id: "VR-009"
    name: "Cross-domain links reference valid domain IDs"
    check: "domains[*].subdomains[*].cross_domain_links all in domains[*].stable_id"
    severity: "error"
  - id: "VR-010"
    name: "Canonical terminology terms are unique"
    check: "unique(canonical_terminology[*].term)"
    severity: "error"
  - id: "VR-011"
    name: "Source family domain map covers all referenced families"
    check: "all source_families in subdomains exist as keys in source_family_domain_map"
    severity: "warning"
  - id: "VR-012"
    name: "Ring-domain mapping covers all 6 domains"
    check: "ring_domain_mapping.ring1.primary_domains + ring2.primary_domains + ring3.primary_domains covers all 6 domain IDs"
    severity: "error"
  - id: "VR-013"
    name: "EN/NL labels present for all domains and subdomains"
    check: "domains[*].label.en exists && domains[*].label.nl exists && domains[*].subdomains[*].label.en exists && domains[*].subdomains[*].label.nl exists"
    severity: "error"
  - id: "VR-014"
    name: "Canonical terms have EN/NL definitions"
    check: "canonical_terminology[*].definition.en exists && canonical_terminology[*].definition.nl exists"
    severity: "error"

